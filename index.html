<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound-to-Binary Converter</title>
<style>
  :root { color-scheme: dark; --bg:#0e1424; --card:#18213a; --line:#2d3a5c; --ink:#eef2ff; --mute:#aab6d6; --wave:#ffb454; --mint:#6ee7c8; --bad:#ffb4b0; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Trebuchet MS", Verdana, sans-serif; line-height:1.55; }
  main { max-width:1180px; margin:auto; padding:0 18px 60px; }
  header { padding:30px 0 6px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; border-bottom:1px solid var(--line); padding-bottom:18px; }
  h1 { font-size:clamp(1.8rem,4.5vw,2.7rem); margin:0 0 4px; letter-spacing:-.5px; }
  h2 { margin:0 0 12px; font-size:1.2rem; color:var(--mint); }
  .subtitle { color:var(--mute); margin:0; }
  .who { text-align:right; color:var(--mute); margin:0; }
  .who strong { color:var(--ink); }
  .layout { display:grid; grid-template-columns:340px minmax(0,1fr); gap:22px; margin-top:22px; align-items:start; }
  .side { position:sticky; top:14px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .results > .panel + .panel { margin-top:20px; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#0c1222; padding:5px; border-radius:10px; margin-bottom:16px; }
  .seg button { background:transparent; color:var(--mute); padding:9px 8px; border-radius:8px; }
  .seg button[aria-selected="true"] { background:var(--mint); color:#082a24; }
  .stack { display:grid; gap:12px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label { display:block; font-weight:bold; }
  input[type=number], select { width:100%; margin-top:6px; padding:11px; border:1px solid #4a5b85; border-radius:8px; background:#0c1222; color:#fff; font:inherit; }
  input.invalid { border-color:#ff7b72; background:#2a1517; }
  .upload { margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .drop { text-align:center; padding:16px 12px; border:2px dashed var(--mint); border-radius:12px; background:#0c1222; color:var(--mute); }
  .drop.over { background:#101a30; border-color:#fff1a4; color:var(--ink); }
  .drop strong { display:block; color:var(--mint); font-size:1.05rem; margin-bottom:8px; }
